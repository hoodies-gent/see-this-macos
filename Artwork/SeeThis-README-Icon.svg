    <rect x="504" y="216" width="108" height="36" class="see-mid"/>
    <rect x="612" y="216" width="36" height="36" class="see-main"/>

    <!-- Row 7 is the only blank row. -->

    <!-- This — rows 8–14. Every two rows, vertical strokes select cells to the left. -->
    <!-- T -->
    <rect x="0" y="288" width="36" height="36" class="deep"/>
    <rect x="36" y="288" width="72" height="36" class="dark"/>
    <rect x="108" y="288" width="72" height="36" class="mid"/>
    <rect x="180" y="288" width="36" height="36" class="main"/>
    <rect x="216" y="288" width="36" height="36" class="light"/>
