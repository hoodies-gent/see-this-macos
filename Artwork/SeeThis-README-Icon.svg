    <rect x="216" y="396" width="36" height="36" class="deep"/>
    <rect x="252" y="396" width="36" height="36" class="mid"/>
    <rect x="324" y="396" width="72" height="36" class="deep"/>
    <rect x="180" y="432" width="36" height="36" class="dark"/>
    <rect x="216" y="432" width="36" height="36" class="mid"/>
    <rect x="288" y="432" width="72" height="36" class="mid"/>
    <rect x="180" y="468" width="72" height="36" class="mid"/>
    <rect x="144" y="468" width="36" height="36" class="deep"/>
    <rect x="288" y="468" width="72" height="36" class="mid"/>
    <rect x="144" y="504" width="36" height="36" class="deep"/>
    <rect x="180" y="504" width="36" height="36" class="mid"/>
    <rect x="252" y="504" width="72" height="36" class="mid"/>

    <!-- i -->
    <rect x="468" y="288" width="36" height="36" class="dark"/>
    <rect x="504" y="288" width="36" height="36" class="main"/>
    <rect x="432" y="360" width="72" height="36" class="dark"/>
    <rect x="432" y="396" width="72" height="36" class="mid"/>
    <rect x="396" y="432" width="72" height="36" class="main"/>
    <rect x="396" y="468" width="72" height="36" class="mid"/>
    <rect x="360" y="504" width="72" height="36" class="deep"/>

    <!-- h → i join at an existing stroke height. -->
    <rect x="360" y="432" width="36" height="36" class="mid"/>

    <!-- s: compact upper bowl, two-cell side walls, and a full five-cell tail. -->
    <rect x="612" y="324" width="108" height="36" class="mid"/>
    <rect x="576" y="360" width="108" height="36" class="mid"/>
    <rect x="684" y="360" width="36" height="36" class="main"/>
    <rect x="540" y="396" width="72" height="36" class="dark"/>
    <rect x="612" y="396" width="36" height="36" class="dark"/>
    <rect x="504" y="432" width="180" height="36" class="dark"/>
    <rect x="576" y="468" width="72" height="36" class="mid"/>
    <rect x="468" y="504" width="36" height="36" class="main"/>
    <rect x="504" y="504" width="36" height="36" class="mid"/>
    <rect x="540" y="504" width="36" height="36" class="dark"/>
    <rect x="576" y="504" width="72" height="36" class="deep"/>

    <!-- i → s join, darkened as overlapping pressure. -->
    <rect x="468" y="432" width="72" height="36" class="mid"/>
  </g>

