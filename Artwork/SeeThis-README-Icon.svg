    <rect x="72" y="324" width="36" height="36" class="main"/>
    <rect x="108" y="324" width="72" height="36" class="light"/>
    <rect x="72" y="360" width="36" height="36" class="main"/>
    <rect x="108" y="360" width="36" height="36" class="mid"/>
    <rect x="36" y="396" width="72" height="36" class="mid"/>
    <rect x="36" y="432" width="72" height="36" class="dark"/>
    <rect x="0" y="468" width="72" height="36" class="dark"/>
    <rect x="0" y="504" width="36" height="36" class="deep"/>
    <rect x="36" y="504" width="36" height="36" class="dark"/>

    <!-- h -->
    <rect x="252" y="288" width="36" height="36" class="deep"/>
    <rect x="288" y="288" width="36" height="36" class="dark"/>
    <rect x="252" y="324" width="36" height="36" class="deep"/>
